<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="CipherHub · 输入姓名或暗号，秒查 Threads / Instagram / TikTok / X / Facebook / 视频 / 短链 全平台归属">
<title>CipherHub · 暗号查询中心</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 不间断背景动效 -->
<div class="bg" aria-hidden="true">
  <div class="aurora"><i></i><i></i><i></i><i></i></div>
  <div class="grid"></div>
  <div class="dots" id="bgDots"></div>
</div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="logo" id="logoBox"><img id="brandLogo" src="" alt="logo"></span>
      <span id="siteName">暗号查询中心</span>
    </a>
    <button class="icon-btn" id="logoBtn" title="切换 Logo" aria-label="切换 Logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-14 14-4-4z"/><path d="M15 4l4 4"/><path d="M2 14h8v8"/>
      </svg>
    </button>
    <nav>
      <a href="/">查询</a>
      <a href="#discover" id="navDiscover">速览</a>
      <a href="#feedback" id="navFeedback">反馈</a>
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>输入 <em>姓名</em> 或 <em>暗号</em>，秒查全平台归属</h1>
    <p id="subtitle">覆盖 Threads、Instagram、TikTok、X、Facebook、视频、短链 —— 支持正查与反查</p>

    <div class="searchbox" id="searchbox">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="加载中…">
        <button class="clear" id="clearBtn" title="清空" aria-label="清空">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="suggest" id="suggest"></div>
    </div>

    <div class="filters">
      <div class="chip-row" id="platFilter"></div>
      <div class="chip-row" id="groupFilter"></div>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <!-- 脱敏速览（替代原来的成员列表）—— 每次刷新都不一样 -->
  <section id="discover" class="discover">
    <div class="sec-head">
      <h2>平台速览</h2>
      <span class="n" id="discoverNote">点击任意平台查看该平台随机样本</span>
      <span class="spacer"></span>
      <button class="btn sm ghost" id="shuffleAll">换一批</button>
    </div>

    <div class="matrix" id="matrix"></div>

    <div class="marquee"><div class="track" id="mqTrack"></div></div>

    <div class="spot">
      <div class="spot-in">
        <div class="spot-label">随机聚焦 · 内容已脱敏</div>
        <div class="spot-body" id="spotBody"></div>
        <div class="spot-foot">
          <span class="spot-dots" id="spotDots"></span>
          <span class="spacer"></span>
          <button class="btn sm ghost" id="spotMore">换一个</button>
        </div>
      </div>
    </div>

    <div id="previewBox" class="preview" style="display:none">
      <div class="sec-head">
        <h2 id="pvTitle">随机样本</h2>
        <span class="n" id="pvNote"></span>
      </div>
      <div class="pv-grid" id="pvGrid"></div>
    </div>

    <div class="tip-bar">
      以上均为<b>随机抽样并脱敏</b>的展示，不是完整名单。<br>
      想知道某条暗号属于谁、或某个人有哪些暗号 —— 在上方输入<b>姓名 / 暗号 / 短链</b>即可。
    </div>
  </section>

  <section id="results" style="display:none"></section>

  <!-- 问题反馈 / 联系方式 -->
  <section id="feedback" class="fb-sec">
    <div class="sec-head">
      <h2 id="fbTitle">问题反馈</h2>
      <span class="n" id="fbSub"></span>
    </div>
    <div class="card fb-card">
      <div class="fb-left">
        <p class="fb-desc" id="fbDesc"></p>
        <div class="contacts" id="fbContacts"></div>
        <div class="tiny muted" id="fbEmpty" style="display:none">管理员暂未填写联系方式，可直接用右侧表单留言。</div>
      </div>
      <form class="fb-form" id="fbForm">
        <div class="form-grid">
          <input class="input" id="fbName" maxlength="40" placeholder="你的称呼（选填）">
          <input class="input" id="fbContact" maxlength="80" placeholder="联系方式：微信 / QQ / 邮箱（选填）">
        </div>
        <textarea class="textarea" id="fbMsg" maxlength="1000" required placeholder="描述遇到的问题，例如：查不到某某的 Instagram 暗号 / 某某的短链失效了…"></textarea>
        <div class="fb-foot">
          <span class="tiny muted" id="fbTip">提交后管理员会在后台看到</span>
          <button class="btn primary" type="submit" id="fbSubmit">提交反馈</button>
        </div>
      </form>
    </div>
  </section>
</main>

<footer class="foot">
  <div><b>CipherHub</b> · 暗号查询中心 · 数据由管理员维护</div>
  <div class="tiny" style="margin-top:6px" id="updatedAt"></div>
</footer>

<button class="fb-fab" id="fbFab" title="问题反馈" aria-label="问题反馈">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
</button>

<div id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
