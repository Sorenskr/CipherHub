# GitHub Pages 自动构建：main 分支永远只保存源代码，
# 静态页面由本工作流在 CI 上生成并发布（生成物不进 main 分支）。
#
# 需要在仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成静态版（index.html / admin.html / assets）
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'admin123' }}
        run: python tools/build_static.py

      - name: 收集发布产物
        run: |
          mkdir -p _site
          cp index.html _site/
          cp admin.html _site/
          cp -r assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
